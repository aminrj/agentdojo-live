apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentdojo.fullname" . }}-backend
  labels:
    {{- include "agentdojo.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.registry }}/{{ .Values.backend.image }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: production
            - name: POSTGRES_HOST
              value: {{ include "agentdojo.fullname" . }}-postgres
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentdojo.fullname" . }}-backend
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              value: redis://{{ include "agentdojo.fullname" . }}-redis:6379/0
            - name: EXFIL_LISTENER_URL
              value: http://{{ include "agentdojo.fullname" . }}-backend:8000/api/exfil/ingest
            - name: EXFIL_LISTENER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentdojo.fullname" . }}-backend
                  key: EXFIL_LISTENER_TOKEN
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 30
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentdojo.fullname" . }}-backend
  labels: {{- include "agentdojo.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
