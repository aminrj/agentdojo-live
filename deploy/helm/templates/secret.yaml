apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentdojo.fullname" . }}-backend
  labels: {{- include "agentdojo.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  EXFIL_LISTENER_TOKEN: {{ .Values.backend.secrets.EXFIL_LISTENER_TOKEN | quote }}
