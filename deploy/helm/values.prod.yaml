# Multi-node overrides. Used by `make deploy-helm`. Not what v1 runs — see docs/SPEC.md §1.2.

image:
  tag: "latest"

backend:
  replicas: 2
  env:
    LLM_PROVIDER: "ollama"
    RATE_LIMIT_PER_HOUR: "50"
  secrets:
    EXFIL_LISTENER_TOKEN: "REPLACE-ME-WITH-A-LONG-RANDOM-STRING"

postgres:
  password: "REPLACE-ME"

ingress:
  host: agentdojo.live
